<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AETHERBLADE — 3D Arena Survivor</title>
<link rel="icon" href="data:,">
<style>
:root{ --u:1; --gold:#f5cf76; --ice:#a8dcff; --bad:#ff6b5e; --panel:rgba(9,13,22,.78);
  /* notch / gesture-bar insets: with viewport-fit=cover a control 16px from the
     edge can sit UNDER the system gesture area, where the OS eats the tap. */
  --sa-t:env(safe-area-inset-top,0px); --sa-r:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#05070d;
  font-family:"Trebuchet MS",Arial,sans-serif;color:#eaf2ff;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#vign{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;transition:opacity .09s}
#hud{position:fixed;inset:0;pointer-events:none;font-size:calc(11px*var(--u))}
.panel{background:var(--panel);border:1px solid rgba(150,190,240,.22);border-radius:calc(7px*var(--u));
  box-shadow:0 3px 14px rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.bar{height:calc(9px*var(--u));border-radius:calc(5px*var(--u));background:rgba(255,255,255,.10);overflow:hidden;
  border:1px solid rgba(255,255,255,.13)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e8434f,#ff8a6a);transition:width .12s}
.bar.xp i{background:linear-gradient(90deg,#3da8ff,#8ee6ff)}
.bar.boss i{background:linear-gradient(90deg,#8b1f2c,#ff4a3d,#ffb14a)}
#hpWrap{position:absolute;left:calc(8px*var(--u) + var(--sa-l));top:calc(7px*var(--u) + var(--sa-t));width:calc(166px*var(--u));padding:calc(6px*var(--u)) calc(7px*var(--u))}
#hpTxt{display:flex;justify-content:space-between;letter-spacing:.08em;font-size:calc(9px*var(--u));
  color:#ffd0c4;margin-bottom:calc(4px*var(--u));font-weight:bold}
#info{display:flex;justify-content:space-between;gap:calc(4px*var(--u));margin-top:calc(5px*var(--u));
  font-size:calc(9px*var(--u));color:var(--gold);letter-spacing:.06em;font-weight:bold}
#info .lv{color:var(--ice)}
.bar.xp{height:calc(4px*var(--u));margin-top:calc(3px*var(--u))}
#fsRow{position:absolute;right:calc(7px*var(--u) + var(--sa-r));top:calc(6px*var(--u) + var(--sa-t));display:flex;gap:calc(5px*var(--u));pointer-events:auto}
.tbtn{width:calc(27px*var(--u));height:calc(27px*var(--u));border-radius:calc(6px*var(--u));
  background:rgba(10,16,28,.86);border:1px solid rgba(160,205,255,.35);color:#dcecff;
  font-size:calc(13px*var(--u));line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tbtn:active{background:rgba(80,130,190,.6)}
#timer{position:absolute;right:calc(7px*var(--u) + var(--sa-r));top:calc(38px*var(--u) + var(--sa-t));width:calc(112px*var(--u));
  padding:calc(5px*var(--u)) calc(8px*var(--u));text-align:right}
#timer .lab{font-size:calc(8px*var(--u));letter-spacing:.14em;color:#9fc4e8}
#timer .val{font-size:calc(17px*var(--u));font-weight:bold;color:var(--gold);letter-spacing:.05em;line-height:1.15}
#bossWrap{position:absolute;left:50%;top:calc(7px*var(--u));transform:translateX(-50%);
  width:min(38vw,calc(320px*var(--u)));padding:calc(5px*var(--u)) calc(8px*var(--u));display:none}
#bossWrap.on{display:block}
#bossName{text-align:center;font-size:calc(10px*var(--u));letter-spacing:.16em;color:#ffd7a1;
  margin-bottom:calc(4px*var(--u));font-weight:bold;text-shadow:0 0 8px rgba(255,80,40,.6)}
.bar.boss{height:calc(10px*var(--u))}
#bossArrow{position:absolute;left:50%;top:50%;width:0;height:0;display:none;pointer-events:none;
  transform-origin:50% 50%;filter:drop-shadow(0 0 6px #ff6338)}
#bossArrow .tri{position:absolute;left:calc(-11px*var(--u));top:calc(-16px*var(--u));width:0;height:0;
  border-left:calc(11px*var(--u)) solid transparent;border-right:calc(11px*var(--u)) solid transparent;
  border-bottom:calc(20px*var(--u)) solid #ff7a45}
#bossArrow .d{position:absolute;left:calc(-10px*var(--u));top:calc(-42px*var(--u));width:calc(20px*var(--u));
  text-align:center;font-size:calc(8px*var(--u));color:#ffb27a;letter-spacing:.06em}
/* ---- controls ---- */
#stickZone{position:fixed;left:0;bottom:0;width:42%;height:76%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:calc(18px*var(--u) + var(--sa-l));bottom:calc(24px*var(--u) + var(--sa-b));
  width:calc(96px*var(--u));height:calc(96px*var(--u));border-radius:50%;
  background:radial-gradient(circle,rgba(120,170,220,.10),rgba(10,18,32,.55));
  border:calc(2px*var(--u)) solid rgba(160,205,255,.42);pointer-events:none;
  box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
#stickKnob{position:absolute;left:50%;top:50%;width:calc(42px*var(--u));height:calc(42px*var(--u));
  margin-left:calc(-21px*var(--u));margin-top:calc(-21px*var(--u));border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#cfe8ff,#4b7fb5);
  border:calc(2px*var(--u)) solid rgba(230,245,255,.8);box-shadow:0 3px 12px rgba(0,0,0,.6)}
#actZone{position:fixed;right:0;bottom:0;width:40%;height:76%;pointer-events:none;touch-action:none}
.abtn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;
  align-items:center;justify-content:center;flex-direction:column;font-weight:bold;letter-spacing:.10em;
  color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.7);border:calc(2px*var(--u)) solid rgba(255,255,255,.5);
  box-shadow:0 5px 18px rgba(0,0,0,.55),inset 0 0 22px rgba(255,255,255,.12);cursor:pointer;z-index:6;
  -webkit-touch-callout:none}
/* invisible hit pad: thumbs miss the visible disc far more often than they
   miss the circle + 10px of padding */
.abtn::after{content:'';position:absolute;inset:calc(-10px*var(--u)) calc(-6px*var(--u));
  border-radius:50%}
.abtn small{font-size:calc(8px*var(--u));letter-spacing:.04em;opacity:.8;font-weight:normal;margin-top:calc(2px*var(--u))}
#btnAttack{right:calc(16px*var(--u) + var(--sa-r));bottom:calc(24px*var(--u) + var(--sa-b));width:calc(96px*var(--u));height:calc(96px*var(--u));
  font-size:calc(15px*var(--u));background:radial-gradient(circle at 38% 30%,#ff9a63,#b32624 75%);
  border-color:rgba(255,190,150,.75)}
#btnRoll{right:calc(122px*var(--u) + var(--sa-r));bottom:calc(38px*var(--u) + var(--sa-b));width:calc(74px*var(--u));height:calc(74px*var(--u));
  font-size:calc(12px*var(--u));background:radial-gradient(circle at 38% 30%,#8fd8ff,#1d4e86 75%);
  border-color:rgba(170,225,255,.7)}
.abtn.press{filter:brightness(1.45);transform:scale(.94)}
#hint{position:absolute;left:50%;bottom:calc(6px*var(--u));transform:translateX(-50%);
  font-size:calc(8px*var(--u));letter-spacing:.08em;color:rgba(200,225,255,.55);white-space:nowrap}
/* ---- overlays ---- */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(3,6,12,.80);z-index:20;pointer-events:auto;padding:calc(10px*var(--u))}
#overlay.on{display:flex}
#ovCard{width:min(94vw,calc(660px*var(--u)));max-height:96vh;overflow:auto;text-align:center;
  background:linear-gradient(180deg,rgba(16,24,40,.97),rgba(7,10,19,.97));
  border:1px solid rgba(170,210,255,.3);border-radius:calc(12px*var(--u));padding:calc(16px*var(--u)) calc(18px*var(--u));
  box-shadow:0 18px 60px rgba(0,0,0,.7)}
#ovKick{font-size:calc(9px*var(--u));letter-spacing:.28em;color:#8fc0ee}
#ovTitle{font-size:calc(30px*var(--u));letter-spacing:.12em;margin:calc(4px*var(--u)) 0;
  color:var(--gold);text-shadow:0 0 24px rgba(245,190,90,.45)}
#ovSub{font-size:calc(12px*var(--u));color:#cfe2ff;margin-bottom:calc(10px*var(--u))}
#ovBody{font-size:calc(10px*var(--u));line-height:1.65;color:#b9cce6;text-align:left;
  margin:calc(8px*var(--u)) auto;max-width:calc(540px*var(--u))}
#ovBody .k{color:var(--gold);font-weight:bold}
#ovBtns{display:flex;gap:calc(8px*var(--u));justify-content:center;flex-wrap:wrap;margin-top:calc(10px*var(--u))}
.bigbtn{pointer-events:auto;cursor:pointer;padding:calc(9px*var(--u)) calc(20px*var(--u));border-radius:calc(8px*var(--u));
  font-size:calc(12px*var(--u));font-weight:bold;letter-spacing:.10em;color:#0a1220;
  background:linear-gradient(180deg,#ffe6a8,#e2a94d);border:1px solid #fff0c8}
.bigbtn.ghost{background:transparent;color:#cfe2ff;border:1px solid rgba(170,210,255,.45)}
#cards{display:flex;gap:calc(8px*var(--u));justify-content:center;flex-wrap:wrap;margin:calc(10px*var(--u)) 0}
.card{width:calc(160px*var(--u));min-height:calc(112px*var(--u));cursor:pointer;pointer-events:auto;
  background:rgba(20,30,50,.9);border:1px solid rgba(150,200,255,.32);border-radius:calc(9px*var(--u));
  padding:calc(10px*var(--u));text-align:left;transition:transform .1s,border-color .1s}
.card:hover{transform:translateY(calc(-3px*var(--u)));border-color:var(--gold)}
.card .ic{font-size:calc(19px*var(--u));color:var(--gold)}
.card .nm{font-size:calc(11px*var(--u));font-weight:bold;color:#fff;margin:calc(4px*var(--u)) 0}
.card .ds{font-size:calc(9px*var(--u));color:#a9c1dd;line-height:1.45}
#credits{font-size:calc(8px*var(--u));color:#7d96b5;line-height:1.5;margin-top:calc(10px*var(--u));letter-spacing:.02em}
#nums{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.dnum{position:absolute;font-weight:bold;font-size:calc(15px*var(--u));letter-spacing:.03em;
  text-shadow:0 2px 4px #000,0 0 8px rgba(0,0,0,.8);will-change:transform,opacity}
#rotate{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:#060a12;text-align:center;font-size:16px;letter-spacing:.14em;color:var(--gold);padding:24px}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:400px){:root{--u:.86}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vign"></div>
<div id="flash"></div>
<div id="hud">
  <div id="hpWrap" class="panel">
    <div id="hpTxt"><span>HP</span><span id="hpNum">100 / 100</span></div>
    <div class="bar"><i id="hpFill"></i></div>
    <div id="info"><span id="scoreTxt">SCORE 0</span><span class="lv" id="lvTxt">LV 1</span></div>
    <div class="bar xp"><i id="xpFill" style="width:0%"></i></div>
  </div>
  <div id="fsRow">
    <button class="tbtn" id="btnMute" aria-label="mute">&#9835;</button>
    <button class="tbtn" id="btnFs" aria-label="fullscreen">&#9974;</button>
  </div>
  <div id="timer" class="panel"><div class="lab" id="timerLab">BOSS ARRIVES IN</div><div class="val" id="timerVal">3:00</div></div>
  <div id="bossWrap" class="panel"><div id="bossName">WARDEN</div><div class="bar boss"><i id="bossFill"></i></div></div>
  <div id="bossArrow"><div class="tri"></div><div class="d">BOSS</div></div>
  <div id="hint">WASD MOVE &nbsp;·&nbsp; SPACE / J ATTACK &nbsp;·&nbsp; SHIFT / K ROLL &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; M MUTE</div>
</div>
<div id="stickZone"><div id="stick"><div id="stickKnob"></div></div></div>
<div id="actZone">
  <div class="abtn" id="btnRoll">ROLL<small>i-frames</small></div>
  <div class="abtn" id="btnAttack">ATTACK<small>3.2 m arc</small></div>
</div>
<div id="nums"></div>
<div id="overlay"><div id="ovCard">
  <div id="ovKick"></div><div id="ovTitle"></div><div id="ovSub"></div>
  <div id="ovBody"></div><div id="cards"></div><div id="ovBtns"></div>
  <div id="credits"></div>
</div></div>
<div id="rotate">ROTATE YOUR PHONE TO LANDSCAPE<br><small style="font-size:11px;letter-spacing:0;color:#9fb6d0">AETHERBLADE is built for landscape play</small></div>
<script>
/*__CORE__*/
</script>
<script>
/*__GAME__*/
</script>
</body>
</html>
